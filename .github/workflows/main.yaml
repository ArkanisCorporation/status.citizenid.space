# Entry workflow for validation, semantic release, and staging delivery.
name: Test & Validate (.NET)

permissions: {}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner pool (override to ubuntu-latest if self-hosted is broken)"
        type: choice
        options:
          - daedalus
          - arkanis-runners
          - ubuntu-latest
        default: daedalus

  repository_dispatch:

  push:
    branches: [ main, release/*, ci ]

  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Workflow
    uses: ArkanisCorporation/ci/.github/workflows/wf-lint-github-actions.yml@v1
    permissions:
      contents: read
    with:
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}
      runs-on-self-hosted: ${{ (github.event_name == 'pull_request' && 'ubuntu-latest' || inputs.runner || vars.RUNNER_DEFAULT || 'daedalus') != 'ubuntu-latest' }}

  test:
    name: Tests
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read
      pull-requests: write
    with:
      runner: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}

  release-dry-run:
    name: "Dry Run: Release"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/_verify-release.yaml
    permissions:
      contents: write
    with:
      runner: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}

  deployment-preflight:
    name: "Dry Run: Kubernetes Deployment"
    needs: release-dry-run
    if: >-
      ${{
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/stable') &&
        needs.release-dry-run.outputs.new-version != ''
      }}
    uses: ./.github/workflows/_verify-kubernetes.yaml
    permissions:
      contents: read
    with:
      runner: ${{ inputs.runner || vars.RUNNER_KUBERNETES || 'arkanis-runners' }}
      target: ${{ github.ref == 'refs/heads/main' && 'staging' || 'production' }}

  release:
    name: Release
    needs: [ lint, test, release-dry-run, deployment-preflight ]
    if: >-
      ${{
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/stable') &&
        needs.release-dry-run.outputs.new-version != ''
      }}
    uses: ./.github/workflows/_release.yaml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}

  deploy-staging:
    name: Deploy Staging
    needs: release
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.release.outputs.release-published == 'true' &&
        needs.release.outputs.new-channel == 'staging'
      }}
    uses: ./.github/workflows/_deploy-kubernetes.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      runner: ${{ inputs.runner || vars.RUNNER_KUBERNETES || 'arkanis-runners' }}
      target: staging
